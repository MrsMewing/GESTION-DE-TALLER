<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Taller</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <h1>GESTION DE TALLER</h1>

    <!-- Menú Principal -->
    <nav class="menu-navegacion">
      <button class="btn-nav activo" onclick="cambiarPestaña('ordenes', this)">ORDENES</button>
      <button class="btn-nav" onclick="cambiarPestaña('notas', this)">NOTAS</button>
    </nav>

    <!-- Área Contenedora -->
    <main class="contenedor-principal">

      <!-- ================= SECCIÓN ÓRDENES ================= -->
      <section id="seccion-ordenes" class="seccion activa">
        
        <!-- Submenú de Estados -->
        <div class="submenu-estados">
          <button class="btn-sub activo" data-estado="pendiente" onclick="filtrarEstados('pendiente', this)">PENDIENTES</button>
          <button class="btn-sub" data-estado="proceso" onclick="filtrarEstados('proceso', this)">EN PROCESO</button>
          <button class="btn-sub" data-estado="terminada" onclick="filtrarEstados('terminada', this)">TERMINADAS</button>
        </div>

        <button class="btn-crear-orden" onclick="abrirModalNuevaOrden()">+ NUEVA ORDEN</button>

        <div class="filtro-fecha-ordenes">
          <input id="filtro-fecha-ordenes" type="date">
          <button class="btn-filtrar-fecha" onclick="filtrarPorFecha()">FILTRAR</button>
          <button class="btn-limpiar-fecha" onclick="limpiarFiltroFecha()">TODAS</button>
        </div>
        <h2 id="titulo-filtro-ordenes" class="titulo-filtro-ordenes">Órdenes de Hoy</h2>

        <!-- Contenedor dinámico de tarjetas -->
        <div id="contenedor-tarjetas" class="lista-ordenes"></div>

      </section>

      <!-- ================= SECCIÓN NOTAS ================= -->
      <section id="seccion-notas" class="seccion">
        <div class="seccion-notas-form">
          <h2>📝 Notas Rápidas</h2>
          <div class="campo-form">
            <label for="nota-titulo">Título</label>
            <input id="nota-titulo" type="text" placeholder="Ej. Recordatorio de reparación">
          </div>
          <div class="campo-form">
            <label for="nota-descripcion">Descripción</label>
            <textarea id="nota-descripcion" placeholder="Escribe la nota..."></textarea>
          </div>
          <div class="campo-form">
            <label for="nota-recordatorio">Fecha y hora de recordatorio</label>
            <input id="nota-recordatorio" type="datetime-local">
          </div>
          <button class="btn-agregar-nota" onclick="guardarNota()">Agregar nota</button>
          <button class="btn-activar-notificaciones" type="button" onclick="activarNotificaciones()">Activar notificaciones</button>
          <div id="estado-notificaciones" class="mensaje-vacio">Las notificaciones de esta página están por definirse.</div>
        </div>

        <div id="contenedor-notas" class="lista-ordenes"></div>
      </section>

    </main>

    <div id="modal-orden" class="modal-oculto">
      <div class="modal-overlay" onclick="cerrarModalOrden(event)">
        <div class="modal-contenido" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h2 id="titulo-modal">Orden</h2>
            <button class="btn-cerrar" onclick="cerrarModalOrden()">Cerrar</button>
          </div>

          <div class="tabs-secciones">
            <button class="tab-seccion activo" data-seccion="cliente" onclick="mostrarSeccionModal(0)">Cliente</button>
            <button class="tab-seccion" data-seccion="equipo" onclick="mostrarSeccionModal(1)">Equipo</button>
            <button class="tab-seccion" data-seccion="falla" onclick="mostrarSeccionModal(2)">Falla</button>
          </div>

          <div id="panel-cliente" class="panel-seccion activo"></div>
          <div id="panel-equipo" class="panel-seccion"></div>
          <div id="panel-falla" class="panel-seccion"></div>
        </div>
      </div>
    </div>

    <div id="modal-nueva-orden" class="modal-oculto">
      <div class="modal-overlay" onclick="cerrarModalNuevaOrden(event)">
        <div class="modal-contenido" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h2>Nueva Orden</h2>
            <button class="btn-cerrar" onclick="cerrarModalNuevaOrden()">Cerrar</button>
          </div>

          <div class="tabs-secciones">
            <button class="tab-seccion activo" data-seccion="cliente" onclick="mostrarSeccionNueva(0)">Cliente</button>
            <button class="tab-seccion" data-seccion="equipo" onclick="mostrarSeccionNueva(1)">Equipo</button>
            <button class="tab-seccion" data-seccion="falla" onclick="mostrarSeccionNueva(2)">Falla</button>
            <button class="tab-seccion" data-seccion="resumen" onclick="mostrarSeccionNueva(3)">Resumen</button>
          </div>

          <div id="panel-nueva-cliente" class="panel-seccion activo"></div>
          <div id="panel-nueva-equipo" class="panel-seccion"></div>
          <div id="panel-nueva-falla" class="panel-seccion"></div>
          <div id="panel-nueva-resumen" class="panel-seccion"></div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="generador_de_comprobante.js"></script>

  </body>
</html>
